[project]
name = "restoresure"
version = "0.1.0"
description = "Linux backup assurance and recovery automation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
restoresure = "restoresure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
